<template>
    <lightning-card title="Opportunités du Compte" icon-name="standard:opportunity">
        <div class="slds-max-large-size_large">
            <div class="slds-m-bottom_medium">
                <lightning-button  label="Rafraîchir" onclick={handleRafraichir} variant="brand"></lightning-button>
            </div>
            <template if:true={opportunities}>
                <div class="slds-box slds-theme_default slds-p-around_none">
                    <lightning-datatable data={opportunities}
                                        columns={columns}
                                        key-field="Id">
                    </lightning-datatable>
                </div>
            </template>
            <template if:true={nodata}>
                <div class="slds-notify slds-notify_alert slds-theme_alert-texture slds-theme_warning" role="alert">
                    <h2>No data has been found.</h2>
                </div>
            </template>
            <template if:true={error}>
                <div class="slds-notify slds-notify_alert slds-theme_alert-texture slds-theme_error" role="alert">
                    <span class="slds-assistive-text">Erreur</span>
                    <h2>Une erreur s'est produite lors du chargement des opportunités.</h2>
                </div>
            </template>
        </div>
    </lightning-card>
</template>
